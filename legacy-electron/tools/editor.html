<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pomoppi icon editor</title>
<!--
  tools/editor.html — hand-rolled pixel editor for the 0/1 grids in
  renderer/sprites.js (ICONS, TRAY, TRAY_FRAMES). Open it with `npm run editor`.

  This is a standalone dev tool loaded in a normal browser, NOT an Electron
  page: the "CSS in a .css file" invariant belongs to renderer/, whose pages set
  style-src 'self'. Here inline <style> and inline <script> are the right call —
  one self-contained file, no build step, no dependency.

  Two canvas sizes, because the art has two kinds:
    13x13  button icons. The cell IS the 13x13 button box, so the button's 1px
           hover border (and the press inversion) lands on the outer ring:
           ink has to stay inside cols/rows 1..11 or it reads as merged with it.
    16x16  TRAY / TRAY_FRAMES. A macOS template image, no button around it and
           no clearance rule — but the system inverts it, hence the light and
           dark previews side by side.
-->
<style>
  :root {
    --cell: 24px;
    --gap: 1px;
    --line: #dcdce2;
    --ink: #1a1a1f;
    --dim: #8a8a95;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px 24px 48px;
    background: #f4f4f6;
    color: #23232a;
    font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
  }

  h1 { margin: 0; font-size: 15px; letter-spacing: .01em; }
  h2 {
    margin: 0 0 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--dim);
  }
  .sub { margin: 3px 0 16px; color: var(--dim); font-size: 12px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  code { background: #e9e9ee; border-radius: 3px; padding: 1px 4px; font-size: 11px; }

  .banner {
    max-width: 780px;
    margin: 0 0 16px;
    padding: 9px 11px;
    border: 1px solid #e3c25a;
    border-left-width: 3px;
    border-radius: 6px;
    background: #fdf6e0;
    font-size: 12px;
    color: #6b551a;
  }

  main { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .panel {
    padding: 14px;
    border: 1px solid #e4e4ea;
    border-radius: 8px;
    background: #fff;
  }
  .side { display: flex; flex-direction: column; gap: 16px; width: 336px; }

  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .bar + .bar { margin-top: 10px; }
  .bar label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6c6c78; }
  .bar .sep { width: 1px; height: 18px; background: var(--line); }
  .bar .grow { flex: 1; }

  select, button {
    font: 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 4px 8px;
    border: 1px solid #d5d5dd;
    border-radius: 5px;
    background: #fff;
    color: #23232a;
  }
  select { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { cursor: pointer; min-width: 28px; }
  button:hover { background: #f1f1f5; }
  button:active { background: #e5e5eb; }
  button:disabled { opacity: .35; cursor: default; background: #fff; }
  .hidden { display: none; }

  /* --- grid ---------------------------------------------------------- */

  .stage { display: grid; grid-template-columns: auto auto; margin: 14px 0 12px; }
  .ruler { display: grid; gap: var(--gap); font: 10px ui-monospace, Menlo, monospace; color: #c2c2ca; }
  .ruler span { display: flex; align-items: center; justify-content: center; }
  .ruler .in { color: #6e6e7a; }
  .ruler-x { grid-column: 2; grid-row: 1; padding: 0 1px 3px; }
  .ruler-y { grid-column: 1; grid-row: 2; padding: 1px 4px 0 0; }
  .ruler-y span { justify-content: flex-end; }

  .grid {
    grid-column: 2;
    grid-row: 2;
    display: grid;
    gap: var(--gap);
    grid-auto-rows: var(--cell);
    background: var(--line);
    border: 1px solid var(--line);
    user-select: none;
  }
  .cell { background: #fff; cursor: crosshair; }
  .cell.ring { background: #fbeeee; }         /* button border draws here */
  .cell.onion { background: #dde5f7; }
  .cell.ring.onion { background: #ebe5f0; }
  .grid .cell.on { background: var(--ink); }

  .legend { margin: 0; font-size: 11px; line-height: 1.6; color: var(--dim); }
  .legend b { font-weight: 600; color: #6e6e7a; }
  .key { display: inline-block; width: 9px; height: 9px; border: 1px solid var(--line); vertical-align: -1px; }
  .key-ring { background: #fbeeee; }
  .key-onion { background: #dde5f7; }

  /* --- readout ------------------------------------------------------- */

  .verdict {
    margin: 0 0 10px;
    padding: 7px 10px;
    border-radius: 6px;
    font: 600 12px/1.3 ui-sans-serif, -apple-system, sans-serif;
    letter-spacing: .02em;
  }
  .verdict.ok { background: #e6f5e9; color: #226b33; }
  .verdict.bad { background: #fce6e6; color: #a8231f; }
  .verdict.none { background: #f0f0f3; color: #7b7b86; }

  .readout { font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .readout .row { display: flex; align-items: baseline; gap: 8px; }
  .readout .k { width: 62px; flex: none; color: var(--dim); }
  .readout .v { flex: 1; }
  .readout .bad { color: #a8231f; font-weight: 600; }
  .problems {
    margin-top: 9px;
    padding: 7px 9px;
    border-left: 3px solid #d95757;
    border-radius: 0 4px 4px 0;
    background: #fdf2f2;
    font: 11px/1.5 ui-sans-serif, -apple-system, sans-serif;
    color: #8f2b28;
  }
  .problems p { margin: 0; }
  .problems p + p { margin-top: 4px; }

  /* --- previews ------------------------------------------------------ */

  .previews {
    display: grid;
    grid-template-columns: 26px auto auto;
    align-items: center;
    justify-items: center;
    gap: 8px 14px;
  }
  .previews .cap { font-size: 10px; color: var(--dim); letter-spacing: .04em; }
  .previews canvas { display: block; image-rendering: pixelated; border: 1px solid #e4e4ea; }

  /* --- code ---------------------------------------------------------- */

  textarea {
    display: block;
    width: 100%;
    height: 292px;
    padding: 8px;
    border: 1px solid #d5d5dd;
    border-radius: 6px;
    background: #fcfcfd;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical;
  }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .note { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
  <h1>Pomoppi icon editor</h1>
  <p class="sub">
    0/1 grids for <code>ICONS</code> (13x13) and <code>TRAY</code> / <code>TRAY_FRAMES</code> (16x16)
    in <code>renderer/sprites.js</code>
  </p>

  <div id="banner" class="banner hidden"></div>

  <main>
    <section class="panel">
      <div class="bar">
        <label id="pick-wrap">icon <select id="pick"></select></label>
        <label id="onion-wrap">onion <select id="onion"></select></label>
        <span class="sep"></span>
        <label>canvas
          <select id="canvas-size" title="13x13 button icon, 16x16 tray template">
            <option value="13">13x13</option>
            <option value="16">16x16</option>
          </select>
        </label>
        <span class="grow"></span>
        <span id="source" class="note mono"></span>
      </div>

      <div class="stage">
        <div id="ruler-x" class="ruler ruler-x"></div>
        <div id="ruler-y" class="ruler ruler-y"></div>
        <div id="grid" class="grid"></div>
      </div>

      <div class="bar" id="tools">
        <button data-act="up" title="shift up (drops what falls off)">&#8593;</button>
        <button data-act="down" title="shift down (drops what falls off)">&#8595;</button>
        <button data-act="left" title="shift left (drops what falls off)">&#8592;</button>
        <button data-act="right" title="shift right (drops what falls off)">&#8594;</button>
        <span class="sep"></span>
        <button data-act="fliph" title="flip horizontal">flip H</button>
        <button data-act="flipv" title="flip vertical">flip V</button>
        <button data-act="invert" title="swap ink and empty">invert</button>
        <button data-act="clear" title="empty the cell">clear</button>
        <span class="sep"></span>
        <button id="undo" title="undo (cmd/ctrl+Z)">undo</button>
        <button id="redo" title="redo (shift+cmd/ctrl+Z)">redo</button>
      </div>

      <p class="legend" id="legend"></p>
    </section>

    <section class="side">
      <div class="panel">
        <h2>Fit</h2>
        <div id="verdict" class="verdict none"></div>
        <div id="readout" class="readout"></div>
      </div>

      <div class="panel">
        <h2>Preview</h2>
        <div class="previews">
          <span></span><span class="cap">light</span><span class="cap">dark</span>
          <span class="cap">1:1</span>
          <canvas id="pv-1-light"></canvas><canvas id="pv-1-dark"></canvas>
          <span class="cap">2:1</span>
          <canvas id="pv-2-light"></canvas><canvas id="pv-2-dark"></canvas>
        </div>
        <div class="foot">
          <label class="note"><input type="checkbox" id="show-box" checked> draw the button's hover border</label>
        </div>
      </div>

      <div class="panel">
        <h2>Code</h2>
        <textarea id="output" spellcheck="false"></textarea>
        <div class="foot">
          <button id="copy">Copy</button>
          <span id="copy-note" class="note"></span>
        </div>
      </div>
    </section>
  </main>

  <!-- sprites.js reads window.FRIEND_ART, so friends.js has to come first.
       Both are classic scripts; if either fails to load the editor falls
       back to paste-only mode instead of breaking. -->
  <script src="../renderer/friends.js"></script>
  <script src="../renderer/sprites.js"></script>
  <script>
  // IIFE for the same reason renderer/widget.js has one: friends.js and sprites.js
  // are classic scripts whose top-level consts share this global scope.
  (function () {
    'use strict';

    const ICON_SIZE = 13;   // button icon: the cell IS the 13x13 button box
    const TRAY_SIZE = 16;   // menu-bar template image, no button around it
    const MAX_INK = ICON_SIZE - 2;  // 11: the ring at 0 and 12 belongs to the border
    const HISTORY_MAX = 100;
    const TYPING_PAUSE = 600;

    const PREVIEWS = [
      { id: 'pv-1-light', scale: 1, dark: false },
      { id: 'pv-1-dark', scale: 1, dark: true },
      { id: 'pv-2-light', scale: 2, dark: false },
      { id: 'pv-2-dark', scale: 2, dark: true },
    ];

    const $ = (id) => document.getElementById(id);
    const ui = {
      banner: $('banner'), pick: $('pick'), pickWrap: $('pick-wrap'),
      onion: $('onion'), onionWrap: $('onion-wrap'), canvasSize: $('canvas-size'),
      source: $('source'), rulerX: $('ruler-x'), rulerY: $('ruler-y'), grid: $('grid'),
      tools: $('tools'), undo: $('undo'), redo: $('redo'), legend: $('legend'),
      verdict: $('verdict'), readout: $('readout'), showBox: $('show-box'),
      output: $('output'), copy: $('copy'), copyNote: $('copy-note'),
    };

    let size = ICON_SIZE;
    let state = blank(size);
    let cells = [];            // [y][x] -> div
    let onionGrid = null;      // same size as the canvas, or null
    let loadedName = '';
    let loadedText = '';

    let drawing = false;
    let drawInk = 1;
    let strokeBefore = null;
    let pendingBefore = null;
    let pendingTimer = 0;
    const undoStack = [];
    const redoStack = [];

    // --- grids ---------------------------------------------------------

    function blank(n) {
      return Array.from({ length: n }, () => new Array(n).fill(0));
    }

    function gridFrom(lines, n) {
      const g = blank(n);
      for (let y = 0; y < n; y++) {
        const line = lines[y] || '';
        for (let x = 0; x < n; x++) if (line[x] === '1') g[y][x] = 1;
      }
      return g;
    }

    const lines = (g) => g.map((row) => row.join(''));
    const textOf = (g) => lines(g).join('\n');
    const codeOf = (g) => '[\n' + lines(g).map((row) => '  "' + row + '",').join('\n') + '\n]';

    function bounds(g) {
      let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
      for (let y = 0; y < g.length; y++) {
        for (let x = 0; x < g.length; x++) {
          if (!g[y][x]) continue;
          if (x < x0) x0 = x;
          if (x > x1) x1 = x;
          if (y < y0) y0 = y;
          if (y > y1) y1 = y;
        }
      }
      if (x1 < 0) return null;
      return { x0, x1, y0, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    }

    // --- the library ----------------------------------------------------

    // Every ICONS key, plus TRAY and any TRAY_FRAMES[n]. Sizes are read off the
    // art, not off ICON_SIZE, so this keeps working whatever sprites.js says.
    function readLibrary() {
      try {
        const S = window.SPRITES;
        if (!S || !S.ICONS) return null;
        const out = [];
        for (const [name, grid] of Object.entries(S.ICONS)) add(out, name, 'ICONS', grid);
        add(out, 'TRAY', 'TRAY', S.TRAY);
        if (Array.isArray(S.TRAY_FRAMES)) {
          S.TRAY_FRAMES.forEach((grid, i) => add(out, 'TRAY_FRAMES[' + i + ']', 'TRAY', grid));
        }
        return out.length ? out : null;
      } catch (err) {
        return null;
      }
    }

    function add(out, name, group, grid) {
      if (!Array.isArray(grid) || !grid.length) return;
      out.push({ name, group, size: grid.length, lines: grid.map(String) });
    }

    const library = readLibrary();

    function fillPicker(select, entries, withNone) {
      select.textContent = '';
      if (withNone) select.appendChild(new Option('none', ''));
      let group = null;
      let groupName = null;
      for (const entry of entries) {
        if (entry.group !== groupName) {
          groupName = entry.group;
          group = document.createElement('optgroup');
          group.label = groupName;
          select.appendChild(group);
        }
        group.appendChild(new Option(entry.name + '  ' + entry.size + 'x' + entry.size, entry.name));
      }
    }

    const entryNamed = (name) => (library || []).find((e) => e.name === name) || null;

    function syncOnionPicker() {
      if (!library) return;
      const keep = ui.onion.value;
      fillPicker(ui.onion, library.filter((e) => e.size === size), true);
      ui.onion.value = entryNamed(keep) && entryNamed(keep).size === size ? keep : '';
      if (!ui.onion.value) onionGrid = null;
    }

    // --- the grid -------------------------------------------------------

    const onRing = (i) => i === 0 || i === size - 1;
    const isButton = () => size === ICON_SIZE;

    function buildGrid() {
      ui.grid.textContent = '';
      ui.rulerX.textContent = '';
      ui.rulerY.textContent = '';
      ui.grid.style.gridTemplateColumns = 'repeat(' + size + ', var(--cell))';
      ui.rulerX.style.gridTemplateColumns = 'repeat(' + size + ', var(--cell))';
      ui.rulerY.style.gridTemplateRows = 'repeat(' + size + ', var(--cell))';

      for (let i = 0; i < size; i++) {
        for (const ruler of [ui.rulerX, ui.rulerY]) {
          const tick = document.createElement('span');
          tick.textContent = String(i);
          if (!isButton() || !onRing(i)) tick.className = 'in';
          ruler.appendChild(tick);
        }
      }

      cells = [];
      for (let y = 0; y < size; y++) {
        const row = [];
        for (let x = 0; x < size; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (isButton() && (onRing(x) || onRing(y))) cell.classList.add('ring');
          cell.addEventListener('mousedown', (e) => {
            e.preventDefault();
            flush();
            strokeBefore = textOf(state);
            drawing = true;
            drawInk = state[y][x] ? 0 : 1;
            paint(x, y);
          });
          cell.addEventListener('mouseenter', () => { if (drawing) paint(x, y); });
          ui.grid.appendChild(cell);
          row.push(cell);
        }
        cells.push(row);
      }

      ui.canvasSize.value = String(size);
      ui.showBox.disabled = !isButton();
      renderLegend();
    }

    function paint(x, y) {
      if (state[y][x] === drawInk) return;
      state[y][x] = drawInk;
      refresh();
    }

    function renderLegend() {
      ui.legend.innerHTML = isButton()
        ? '<b>13x13 button icon.</b> <span class="key key-ring"></span> the button paints its 1px hover ' +
          'border on the outer ring and inverts the whole box on press, so ink has to stay inside ' +
          'cols/rows 1..' + MAX_INK + '. <span class="key key-onion"></span> onion skin. ' +
          'Drag to draw, drag from an inked pixel to erase.'
        : '<b>16x16 tray template.</b> macOS keeps only the alpha and inverts it, so it has to read ' +
          'on both backgrounds; no button, no clearance rule. ' +
          '<span class="key key-onion"></span> onion skin. Drag to draw, drag from an inked pixel to erase.';
    }

    // --- rendering ------------------------------------------------------

    function refresh(writeCode) {
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = cells[y][x];
          cell.classList.toggle('on', state[y][x] === 1);
          cell.classList.toggle('onion', !!onionGrid && onionGrid[y][x] === 1);
        }
      }
      if (writeCode !== false) ui.output.value = codeOf(state);
      renderReadout();
      renderPreviews();
      renderSource();
      ui.undo.disabled = undoStack.length === 0;
      ui.redo.disabled = redoStack.length === 0;
    }

    function renderSource() {
      if (!loadedName) { ui.source.textContent = ''; return; }
      ui.source.textContent = loadedName + (textOf(state) === loadedText ? '' : ' · edited');
    }

    function renderReadout() {
      const b = bounds(state);
      if (!b) {
        ui.verdict.className = 'verdict none';
        ui.verdict.textContent = 'empty cell';
        ui.readout.innerHTML = '';
        return;
      }

      const last = size - 1;
      const problems = [];
      if (isButton()) {
        if (b.x0 < 1 || b.x1 > MAX_INK) {
          problems.push('Ink reaches the left/right edge of the box (cols ' + b.x0 + '..' + b.x1 +
            '). The hover border draws on col 0 and col ' + last + ', so it will read as merged with it.');
        }
        if (b.y0 < 1 || b.y1 > MAX_INK) {
          problems.push('Ink reaches the top/bottom edge of the box (rows ' + b.y0 + '..' + b.y1 +
            '). The hover border draws on row 0 and row ' + last + ', so it will read as merged with it.');
        }
        if (b.w > MAX_INK) problems.push('Ink is ' + b.w + ' wide; ' + MAX_INK + ' is the most that clears the border.');
        if (b.h > MAX_INK) problems.push('Ink is ' + b.h + ' tall; ' + MAX_INK + ' is the most that clears the border.');
      }

      const badX = isButton() && (b.x0 < 1 || b.x1 > MAX_INK || b.w > MAX_INK);
      const badY = isButton() && (b.y0 < 1 || b.y1 > MAX_INK || b.h > MAX_INK);
      const gapL = b.x0, gapR = last - b.x1, gapT = b.y0, gapB = last - b.y1;
      const lean = gapL - gapR;
      // An odd run in an even cell (and vice versa) can never sit dead centre;
      // 1px of lean is the best it can do, so don't cry wolf about it.
      const slack = (size - b.w) % 2;
      const centred = Math.abs(lean) <= slack;

      ui.verdict.className = 'verdict ' + (problems.length ? 'bad' : 'ok');
      ui.verdict.textContent = problems.length
        ? (problems.length === 1 ? 'does not fit the button' : 'does not fit the button (' + problems.length + ' problems)')
        : isButton() ? 'fits the button box' : 'tray cell — no clearance rule';

      ui.readout.innerHTML =
        row('x', b.x0 + '..' + b.x1 + '   w ' + b.w, badX) +
        row('y', b.y0 + '..' + b.y1 + '   h ' + b.h, badY) +
        row('margins', 'L' + gapL + ' R' + gapR + ' T' + gapT + ' B' + gapB, false) +
        row('centred', centred ? (lean === 0 ? 'yes' : 'yes (' + Math.abs(lean) + 'px lean, odd run)')
          : Math.abs(lean) + 'px ' + (lean > 0 ? 'right' : 'left') + ' of centre', !centred) +
        (isButton() ? row('room', 'cols/rows 1..' + MAX_INK + ', max ' + MAX_INK + 'x' + MAX_INK, false) : '') +
        (problems.length ? '<div class="problems">' + problems.map((p) => '<p>' + p + '</p>').join('') + '</div>' : '');
    }

    function row(k, v, bad) {
      return '<div class="row"><span class="k">' + k + '</span><span class="v' + (bad ? ' bad' : '') + '">' + v + '</span></div>';
    }

    function renderPreviews() {
      for (const spec of PREVIEWS) {
        const canvas = $(spec.id);
        canvas.width = size * spec.scale;
        canvas.height = size * spec.scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = spec.dark ? '#1c1c1e' : '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const ink = spec.dark ? '#ffffff' : '#000000';
        if (isButton() && ui.showBox.checked) {
          ctx.fillStyle = spec.dark ? '#55555e' : '#c8c8d0';
          ctx.fillRect(0, 0, canvas.width, spec.scale);
          ctx.fillRect(0, canvas.height - spec.scale, canvas.width, spec.scale);
          ctx.fillRect(0, 0, spec.scale, canvas.height);
          ctx.fillRect(canvas.width - spec.scale, 0, spec.scale, canvas.height);
        }
        ctx.fillStyle = ink;
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if (state[y][x]) ctx.fillRect(x * spec.scale, y * spec.scale, spec.scale, spec.scale);
          }
        }
      }
    }

    // --- history --------------------------------------------------------

    function commit(before) {
      if (before === null || before === textOf(state)) return;
      undoStack.push(before);
      if (undoStack.length > HISTORY_MAX) undoStack.shift();
      redoStack.length = 0;
      ui.undo.disabled = false;
      ui.redo.disabled = true;
    }

    // Keystrokes in the textarea group into one undo step, closed by a pause or
    // by the next action that needs a clean history.
    function schedule(before) {
      if (pendingBefore === null) pendingBefore = before;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(flush, TYPING_PAUSE);
    }

    function flush() {
      if (pendingBefore === null) return;
      clearTimeout(pendingTimer);
      const before = pendingBefore;
      pendingBefore = null;
      commit(before);
      ui.undo.disabled = undoStack.length === 0;
    }

    function restore(text) {
      const rows = text.split('\n');
      if (rows.length !== size) {
        size = rows.length;
        buildGrid();
        syncOnionPicker();
      }
      state = gridFrom(rows, size);
      refresh();
    }

    function undo() {
      flush();
      if (!undoStack.length) return;
      redoStack.push(textOf(state));
      restore(undoStack.pop());
    }

    function redo() {
      flush();
      if (!redoStack.length) return;
      undoStack.push(textOf(state));
      restore(redoStack.pop());
    }

    // --- transforms -----------------------------------------------------

    function shifted(g, dx, dy) {
      const out = blank(g.length);
      for (let y = 0; y < g.length; y++) {
        for (let x = 0; x < g.length; x++) {
          const ny = y + dy, nx = x + dx;
          if (ny >= 0 && ny < g.length && nx >= 0 && nx < g.length) out[ny][nx] = g[y][x];
        }
      }
      return out;
    }

    const ACTIONS = {
      up: (g) => shifted(g, 0, -1),
      down: (g) => shifted(g, 0, 1),
      left: (g) => shifted(g, -1, 0),
      right: (g) => shifted(g, 1, 0),
      fliph: (g) => g.map((row) => row.slice().reverse()),
      flipv: (g) => g.slice().reverse(),
      invert: (g) => g.map((row) => row.map((v) => (v ? 0 : 1))),
      clear: (g) => blank(g.length),
    };

    // --- loading and resizing -------------------------------------------

    function load(entry) {
      flush();
      const before = textOf(state);
      if (entry.size !== size) {
        size = entry.size;
        buildGrid();
        syncOnionPicker();
      }
      state = gridFrom(entry.lines, size);
      loadedName = entry.name;
      loadedText = textOf(state);
      commit(before);
      refresh();
    }

    // Resizing keeps the art centred (13 -> 16 offsets it by 1, 16 -> 13 crops
    // the outer ring back off); the shift buttons fix up anything else.
    function resize(n) {
      if (n === size) return;
      flush();
      const before = textOf(state);
      const old = state;
      const off = Math.trunc((n - old.length) / 2);   // floor would skew the crop
      size = n;
      state = blank(n);
      for (let y = 0; y < old.length; y++) {
        for (let x = 0; x < old.length; x++) {
          const ny = y + off, nx = x + off;
          if (ny >= 0 && ny < n && nx >= 0 && nx < n) state[ny][nx] = old[y][x];
        }
      }
      buildGrid();
      syncOnionPicker();
      commit(before);
      refresh();
    }

    // The textarea takes whatever it is given: runs of 0/1 at either canvas
    // size, so pasting a 16x16 tray grid onto a 13x13 canvas switches to it.
    function parse(text) {
      const runs = text.match(/[01]{13,16}/g) || [];
      const tally = new Map();
      for (const run of runs) tally.set(run.length, (tally.get(run.length) || 0) + 1);
      const n = (tally.get(TRAY_SIZE) || 0) >= 3 ? TRAY_SIZE
        : (tally.get(ICON_SIZE) || 0) >= 3 ? ICON_SIZE : size;
      return { n, rows: runs.filter((run) => run.length === n).slice(0, n) };
    }

    // --- wiring ---------------------------------------------------------

    buildGrid();

    if (library) {
      fillPicker(ui.pick, library, false);
      syncOnionPicker();
      ui.pick.addEventListener('change', () => {
        const entry = entryNamed(ui.pick.value);
        if (entry) load(entry);
      });
      ui.onion.addEventListener('change', () => {
        const entry = entryNamed(ui.onion.value);
        onionGrid = entry ? gridFrom(entry.lines, size) : null;
        refresh();
      });
      load(library[0]);
      undoStack.length = 0;   // the first load is not an edit
      refresh();
    } else {
      ui.pickWrap.classList.add('hidden');
      ui.onionWrap.classList.add('hidden');
      ui.banner.classList.remove('hidden');
      ui.banner.innerHTML = '<b>Paste-only mode.</b> <code>renderer/sprites.js</code> did not load — ' +
        'browsers block subresource loads over <code>file://</code>. Run <code>npm run editor</code> ' +
        'and open <code>http://localhost:8173/tools/editor.html</code> to get the icon picker and the ' +
        'onion skin. Everything else works: draw, or paste a grid into the code box.';
      refresh();
    }

    ui.canvasSize.addEventListener('change', () => resize(Number(ui.canvasSize.value)));

    ui.tools.addEventListener('click', (e) => {
      const act = e.target.dataset && e.target.dataset.act;
      if (!act) return;
      flush();
      const before = textOf(state);
      state = ACTIONS[act](state);
      commit(before);
      refresh();
    });

    ui.undo.addEventListener('click', undo);
    ui.redo.addEventListener('click', redo);
    ui.showBox.addEventListener('change', renderPreviews);

    document.addEventListener('mouseup', () => {
      if (!drawing) return;
      drawing = false;
      commit(strokeBefore);
      strokeBefore = null;
      refresh();
    });

    ui.output.addEventListener('input', () => {
      const before = textOf(state);
      const parsed = parse(ui.output.value);
      if (parsed.n !== size) {
        size = parsed.n;
        buildGrid();
        syncOnionPicker();
      }
      state = gridFrom(parsed.rows, size);
      refresh(false);
      schedule(before);
    });

    document.addEventListener('keydown', (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
      if (e.target === ui.output) return;  // leave the textarea its own undo
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    });

    ui.copy.addEventListener('click', async () => {
      const code = codeOf(state);
      try {
        await navigator.clipboard.writeText(code);
      } catch (err) {
        ui.output.select();
        document.execCommand('copy');
      }
      ui.copyNote.textContent = 'copied ' + size + ' lines';
      setTimeout(() => { ui.copyNote.textContent = ''; }, 1600);
    });
  })();
  </script>
</body>
</html>
