# Release-only GitHub Actions workflow for building and packaging the Windows
# version of Pomoppi. This is NOT a per-commit CI gate — it only runs on manual
# triggers (workflow_dispatch) or when a release is published.
#
# The gha-setup-swift action is pinned to a commit SHA rather than a version
# tag because, as of Sept 2026, gha-setup-swift's tag resolution is broken
# (see WINDOWS_PORT_PLAN.md's locked-decisions list). SHA
# 397094e75494a93fa8d81db0268dbc8f5d6cf7c6 was that repo's actual latest
# commit as of 2026-09-18, not something this workflow has itself been run
# against yet — this repo's dev VM builds locally via Scripts/make-windows-app.js
# and never runs GitHub Actions, so this specific job is unverified until it
# actually runs once for real.

name: Release Windows

on:
  workflow_dispatch:
  release:
    types: [published]

# contents: write is needed for the final "gh release upload" step — many
# orgs now default GITHUB_TOKEN to read-only, which would otherwise 403
# there.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.4-release
          swift-build: 6.4-RELEASE
          build_arch: amd64

      - name: Build and package Windows app
        run: node Scripts/make-windows-app.js

      - uses: actions/upload-artifact@v4
        with:
          name: Pomoppi-win
          path: dist/Pomoppi-win.zip

      - name: Upload to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} dist/Pomoppi-win.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
